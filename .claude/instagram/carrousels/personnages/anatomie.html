<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Anatomie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #444; font-family: Inter, sans-serif; }
  section { width: 1800px; padding: 70px; background: #f6f4ec; color: #141414; }
  h1 { font-family: Oswald, sans-serif; text-transform: uppercase; font-size: 64px; }
  h1 span { background: #e46d29; padding: 0 16px 4px; display: inline-block; transform: rotate(-1.5deg); }
  h2 { font-family: Oswald, sans-serif; text-transform: uppercase; font-size: 36px; margin-top: 50px; }
  .sous { font-size: 20px; opacity: .7; margin-top: 10px; }
  .grille { display: grid; grid-template-columns: repeat(4, 300px); gap: 40px; margin-top: 26px; text-align: center; }
  .grille svg { width: 100%; height: 560px; }
  .lab { font-weight: 700; font-size: 22px; }
  .lab small { display: block; font-weight: 500; opacity: .6; }
  .zones { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 26px; text-align: center; }
  .zones svg { width: 100%; height: 230px; }
  .zones div { font-weight: 700; font-size: 17px; }
  .zones small { display: block; font-weight: 500; font-size: 14px; opacity: .55; }
  p.code { margin-top: 30px; font-size: 18px; opacity: .65; }
</style>
</head>
<body>
<section>
  <h1>Le corps <span>et ses muscles</span></h1>
  <p class="sous">Exemple : le squat. Orange plein = muscle principal, orange clair = muscle qui aide.</p>
  <div class="grille" id="g"></div>
  <h2>Les zones, de face</h2>
  <div class="zones" id="zf"></div>
  <h2>Les zones, de dos</h2>
  <div class="zones" id="zd"></div>
  <p class="code">Perso.anatomie({ type: 'homme' | 'femme', vue: 'face' | 'dos', muscles: { quadriceps: 1, fessiers: 1, ischios: .5 } })</p>
</section>
<script src="../personnages.js"></script>
<script>
const NOMS = { deltoides: 'Épaules', pectoraux: 'Pectoraux', biceps: 'Biceps', avantbras: 'Avant-bras', abdominaux: 'Abdominaux',
  obliques: 'Obliques', quadriceps: 'Quadriceps', adducteurs: 'Adducteurs', mollets: 'Mollets', tibial: 'Tibial',
  trapezes: 'Trapèzes', triceps: 'Triceps', dorsaux: 'Dorsaux', lombaires: 'Lombaires', fessiers: 'Fessiers', ischios: 'Ischios' };
const squat = { quadriceps: 1, fessiers: 1, ischios: .5, adducteurs: .5, mollets: .3, abdominaux: .4, lombaires: .4 };
const fig = (o, h) => `<svg viewBox="0 0 200 440">${Perso.anatomie(o)}</svg>`;
let g = '';
for (const t of ['homme', 'femme']) for (const v of ['face', 'dos'])
  g += `<div>${fig({ type: t, vue: v, muscles: squat })}<div class="lab">${t === 'homme' ? 'Homme' : 'Femme'}, ${v}</div></div>`;
document.getElementById('g').innerHTML = g;
for (const [id, vue] of [['zf', 'face'], ['zd', 'dos']])
  document.getElementById(id).innerHTML = Perso.MUSCLES[vue].map(m =>
    `<div>${fig({ type: 'homme', vue, muscles: { [m]: 1 } })}${NOMS[m]}<small>${m}</small></div>`).join('');
</script>
</body>
</html>
